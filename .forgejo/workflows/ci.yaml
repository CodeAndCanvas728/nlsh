name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This Forgejo instance has an ubuntu runner and a self-hosted one, which
# is a Mac. There is no Windows runner, so Windows is cross-built by the
# release workflow rather than tested here.
#
# Each check is its own job so that a failure says which one it was.

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: check the source is formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    name: vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

  # One job for every package rather than one job per package: a hardcoded
  # list of packages goes stale, and a new package would then never be
  # tested. `go test` prints a line per package, so a failure still names
  # the package it came from.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test -v ./...

  # The macos runner is a Mac. This is where the Darwin profile, the zsh
  # path and the macOS build are exercised; the ubuntu runner is a
  # different operating system, so it cannot cover them.
  test-macos:
    name: test (macos)
    runs-on: macos
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

  # The race detector needs a C compiler to build the instrumented runtime.
  # The job installs one if the runner does not have it, and fails if it
  # cannot: a green "race" job that quietly did not run the detector would
  # make the release gate mean less than it looks.
  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install a C compiler for the race detector
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc is already installed"
            exit 0
          fi
          # The braces matter: without them "! a && b" means "(! a) && b",
          # so the install would be skipped whenever the update succeeded.
          if ! { apt-get update && apt-get install -y gcc; }; then
            sudo apt-get update && sudo apt-get install -y gcc
          fi

      - name: test with the race detector
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            echo "no C compiler on this runner: the race detector cannot run"
            exit 1
          fi
          go test -race ./...

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: go build -trimpath -o nlsh ./cmd/nlsh

      - name: smoke test
        run: |
          ./nlsh --version
          ./nlsh --help > /dev/null
          ./nlsh --zsh-init > /dev/null

  # The Homebrew formula lives in this repository and is copied to the tap
  # at every release. Nothing inside the tap can tell you that the copy is
  # behind: the old asset reports the old version, and Homebrew derives that
  # version from the URL in the old formula, so the two agree and nothing
  # fails. The difference against this repository can.
  # (`homebrew-nlsh` here is the same tap the README tells users to add
  # as `CodeAndCanvas728/nlsh`.)
  tap:
    name: tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: the tap's formula is this one
        run: |
          # The version appears in four URLs; all four must carry the same
          # tag, and that tag must match internal/cli/usage.go's Version.
          # A release that bumps three of them leaves the fourth pointing
          # at an old tag, and nothing else catches it.
          versions=$(grep -o 'download/v[^/]*/' homebrew/nlsh.rb | sort -u || true)
          expected="v$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' internal/cli/usage.go)"
          if [ -z "$versions" ] || [ "$versions" != "download/$expected/" ]; then
            echo "homebrew/nlsh.rb's URLs do not all carry $expected:"
            printf '%s\n' "$versions"
            exit 1
          fi
          # A clone rather than a fetch of the raw file: the raw file is
          # served from a cache, so a tap that was updated a minute ago
          # would still read as the old one.
          if ! git clone --depth 1 -q https://github.com/CodeAndCanvas728/homebrew-nlsh.git /tmp/tap 2>/tmp/clone.err; then
            echo "could not fetch the tap (network, rename, or private):"
            cat /tmp/clone.err
            exit 1
          fi
          if ! diff -u homebrew/nlsh.rb /tmp/tap/Formula/nlsh.rb; then
            echo "the tap's formula is not this one."
            echo "Copy homebrew/nlsh.rb to the tap and commit it there."
            exit 1
          fi
          echo "the tap's formula matches this repository"
