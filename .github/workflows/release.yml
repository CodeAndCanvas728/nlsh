name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: darwin
            arch: arm64
            runner: macos-latest
          - target: darwin-amd64
            os: darwin
            arch: amd64
            runner: macos-latest
          - target: linux-amd64
            os: linux
            arch: amd64
            runner: ubuntu-latest
          - target: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-latest
          - target: windows-amd64
            os: windows
            arch: amd64
            runner: windows-latest
          - target: windows-arm64
            os: windows
            arch: arm64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o "nlsh-${{ matrix.target }}" ./cmd/nlsh

      - name: archive
        shell: bash
        run: |
          name="nlsh-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            mv "$name.exe" "$name.zip"
            zip -q "$name.zip" "$name.exe"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          shasum -a 256 "$name".* > "$name".sha256

      - uses: actions/upload-artifact@v4
        with:
          name: nlsh-${{ matrix.target }}
          path: |
            nlsh-${{ matrix.target }}.tar.gz
            nlsh-${{ matrix.target }}.zip
            nlsh-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect the archives
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec mv {} dist/ \;

      - name: write the checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - name: create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
